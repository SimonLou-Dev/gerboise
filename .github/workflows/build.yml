name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - uses: snok/install-poetry@v1
      - run: poetry install --no-interaction
      - run: poetry run ruff check .
      - run: poetry run pytest

  # Analyse les commits conventionnels (feat:, fix:, ...) depuis le dernier tag et,
  # s'il y a une raison de bumper, met à jour pyproject.toml + CHANGELOG.md, commit,
  # tag (vX.Y.Z) et pousse directement sur main. N'a de sens que sur push main.
  release:
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      released: ${{ steps.release.outputs.released }}
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: release
        uses: python-semantic-release/python-semantic-release@v9
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}

  build:
    needs: [test, release]
    # `release` est skip sur un push de tag (pas sur main) : on ne veut pas que ça
    # entraîne le skip de build, seul le succès de `test` doit être requis.
    if: always() && needs.test.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: image_name
        run: echo "name=ghcr.io/$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')/gerboise" >> "$GITHUB_OUTPUT"
      - id: tags
        run: |
          IMAGE="${{ steps.image_name.outputs.name }}"
          TAGS=""
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            TAGS="$IMAGE:latest"
          fi
          if [ "${{ needs.release.outputs.released }}" = "true" ]; then
            TAGS="${TAGS:+$TAGS,}$IMAGE:${{ needs.release.outputs.tag }}"
          fi
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            TAGS="${TAGS:+$TAGS,}$IMAGE:${{ github.ref_name }}"
          fi
          echo "tags=$TAGS" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
